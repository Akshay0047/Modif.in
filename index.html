    <title>MODIF.in | Text, image and document tools</title>
    <link rel="canonical" href="https://modif.in/" />
    <script>
      (function () {
        var link = document.querySelector('link[rel="canonical"]');
        if (!link) return;
        var path = location.pathname || "/";
        try {
          path = decodeURI(path);
        } catch (e) {}
        path = path.replace(/\/+$/, "").toLowerCase() || "/";
        link.setAttribute("href", path === "/" ? "https://modif.in/" : "https://modif.in" + path);
      })();
    </script>
