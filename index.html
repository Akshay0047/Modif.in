<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preload" href="/favicon.ico" as="image" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="preload" href="/src/assets/fonts/ibm-plex-sans-v23-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta
      name="google-site-verification"
      content="u8_JVsFvIy3JDIlUvKJjOyLDNwW2yGB0_Dqs0aZwI7w"
    />
    <!-- modif:route-meta:start -->
    <title>Modif – Free Online Image, Text &amp; Document Tools</title>
    <meta name="description" content="Free tools for text, images, PDF, DOCX and CSV files. Everything runs in your browser. Your files and text stay on your device, with no uploads or tracking." />
    <link rel="canonical" href="https://modif.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Modif – Free Online Image, Text &amp; Document Tools" />
    <meta property="og:description" content="Free tools for text, images, PDF, DOCX and CSV files. Everything runs in your browser. Your files and text stay on your device, with no uploads or tracking." />
    <meta property="og:url" content="https://modif.in/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Modif – Free Online Image, Text &amp; Document Tools" />
    <meta name="twitter:description" content="Free tools for text, images, PDF, DOCX and CSV files. Everything runs in your browser. Your files and text stay on your device, with no uploads or tracking." />
    <!-- modif:route-meta:end -->
    <style>
      :root { --app-header-height: 64px; --z-page-loader: 900; }
      html.modif-page-loading, html.modif-page-loading body, html.modif-page-loading #root { overflow: hidden !important; }
      .page-loader { position: fixed; inset: var(--app-header-height) 0 0; z-index: var(--z-page-loader); display: grid; place-content: center; gap: 1.5rem; padding: 1.5rem; background: #000; color: #f8fafc; text-align: center; opacity: 1; transition: opacity 200ms ease-out; }
      .page-loader__logo { display: block; width: 64px; height: 64px; justify-self: center; object-fit: contain; animation: modif-loading-pulse 1.4s ease-in-out infinite; }
      .page-loader[data-state="loading"] { opacity: 1; transition: none; }
      .page-loader[data-state="revealing"], .page-loader[data-state="hidden"] { opacity: 0; }
      .page-loader[data-state="hidden"] { visibility: hidden; pointer-events: none; }
      .page-loader[data-motion="still"] .page-loader__logo, .page-loader[data-state="failed"] .page-loader__logo { animation: none; }
      .page-loader__recovery { max-width: 26rem; font: 1rem/1.6 "IBM Plex Sans", sans-serif; }
      .page-loader__recovery button { min-height: 44px; padding: .6rem 1rem; border: 1px solid #94a3b8; border-radius: 8px; background: #0a0f1c; color: inherit; font: inherit; }
      .page-loader__recovery button:hover { border-color: #f8fafc; }
      .page-loader__recovery button:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 4px; }
      #page-loader, #page-loader * { cursor: auto !important; }
      #page-loader button { cursor: pointer !important; }
      @keyframes modif-loading-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (max-width: 700px) { :root { --app-header-height: 56px; } }
      @media (prefers-reduced-motion: reduce) { .page-loader { transition: none; } .page-loader__logo { animation: none; } }
    </style>
  </head>
  <body>
    <div id="page-loader" class="page-loader" data-state="loading" role="status" aria-label="Loading page">
      <img class="page-loader__logo" src="/favicon.ico" width="64" height="64" alt="" aria-hidden="true" fetchpriority="high" />
      <div id="boot-recovery" class="page-loader__recovery" hidden>
        <p>This page could not load. Check your connection and try again.</p>
        <button type="button" onclick="window.location.reload()">Reload page</button>
      </div>
    </div>
    <div id="root" inert aria-busy="true" data-loader-boot></div>
    <script>
      (function () {
        var loader = document.getElementById("page-loader");
        document.documentElement.classList.add("modif-page-loading");
        try { if (localStorage.getItem("modif-animation") === "off") loader.dataset.motion = "still"; } catch (e) {}
        window.__modifBootTimer = setTimeout(function () {
          loader.dataset.state = "failed";
          loader.setAttribute("role", "alert");
          loader.setAttribute("aria-label", "Page could not load");
          document.getElementById("boot-recovery").hidden = false;
        }, 20000);
      })();
    </script>
    <noscript><style>#page-loader { display: none; }</style><p>Enable JavaScript to use MODIF.in.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
